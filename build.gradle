buildscript {
	repositories {
		mavenLocal()
		maven {
			name 'Beanification'
			url 'https://maven.tamaized.com/releases/'
		}
	}
	dependencies {
		classpath "tamaized:beanification:${beanification_version}:gradle"
	}
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Version List: https://projects.neoforged.net/neoforged/ModDevGradle
    id 'net.neoforged.moddev' version "${mdg_version}"
    id "com.dorongold.task-tree" version "4.0.0"
	id 'com.gradleup.shadow' version "${shadowjar_version}"
}

apply plugin: 'tamaized.beanification'

repositories {
	gradlePluginPortal()
}

dependencies { // Forces intellij to grab sources for the gradle build script
	compileOnly "com.gradleup.shadow:shadow-gradle-plugin:${shadowjar_version}"
}

wrapper {
	gradleVersion = '9.1.0'
	distributionType = Wrapper.DistributionType.ALL
}

configurations {
    shade
}

shadowJar {
	mustRunAfter jar
    archiveClassifier.set('')
    configurations = [project.configurations.shade]
    relocate 'tamaized.beanification', 'tamaized.voidfog.beanification'
    relocate 'tamaized.pkginfoutil', 'tamaized.voidfog.pkginfoutil'
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream {
        stream -> secrets.load(stream)
    }

    fileTree("secrets").matching {
        include "**/*.properties"
    }.each {
        File file ->
            file.withInputStream {
                stream -> secrets.load(stream)
            }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

version = "${project.minecraft_version}-${project.mod_major_version}." + (hasProperty("CIVersion") ? CIVersion : mod_version)
group = "tamaized.${project.mod_id}"

base {
    archivesName = "VoidFog"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

compileJava.options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-this-escape" << "-Werror"

sourceSets {
	data {
		compileClasspath += main.compileClasspath + main.output

		java {
			srcDirs = ['src/main/java', 'src/data/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
	dataForPublishing {
		compileClasspath += data.compileClasspath

		java {
			srcDirs = ['src/data/java']
		}
	}
}

configurations {
	dataImplementation.extendsFrom implementation
}

neoForge {
	def mod_id = project.mod_id
	version = project.neoforge_version

    validateAccessTransformers = true

    mods {
		"${mod_id}" {
			it.sourceSet this.sourceSets.main
		}

		"${mod_id}-data" {
			it.sourceSet this.sourceSets.main
			it.sourceSet this.sourceSets.data
		}
    }

	def mainMod = mods."${project.mod_id}"
	def dataMod = mods."${project.mod_id}-data"

	unitTest {
		enable()
		testedMod = mainMod
		loadedMods = [mainMod]
	}

    runs {
		configureEach {
			gameDirectory = project.file('run')
			systemProperty 'forge.logging.console.level', 'debug'
			logLevel = org.slf4j.event.Level.DEBUG
			loadedMods = [mainMod]
		}

		client {
			client()
			systemProperty 'forge.enabledGameTestNamespaces', mod_id
			programArguments.addAll '--username', secrets.getProperty("username") ?: 'Dev', secrets.getProperty("uuid") ? '--uuid' : '', secrets.getProperty("uuid") ?: ''
		}

		server {
			server()
			systemProperty 'forge.enabledGameTestNamespaces', mod_id
			programArgument '--nogui'
		}

		data {
			clientData()
			gameDirectory = project.file('run-data')
			programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
			sourceSet = this.sourceSets.data
			loadedMods = [dataMod]
		}
    }
}

repositories {
    mavenLocal()
    maven {
        name 'Tama\'s Maven'
        url 'https://maven.tamaized.com/releases/'
    }
    maven {
        name 'Jared\'s Maven' // JEI
        url 'https://maven.blamejared.com/'
    }
}

dependencies {
    // runtimeOnly "mezz.jei:jei-${project.base_minecraft_version}-neoforge:${project.jei_version}"

	def beanification = "tamaized:beanification:${project.beanification_version}"
	implementation beanification
	shade beanification
	testImplementation "${beanification}:tests"
	testCompileOnly "${beanification}:test-sources"

	def pkgInfoUtil = "tamaized:pkginfoutil:${project.pkginfoutil_version}"
	implementation pkgInfoUtil
	shade pkgInfoUtil

	testImplementation "net.neoforged:testframework:${project.neoforge_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.0.1"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.0.1"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.0.1"
	testImplementation "org.mockito:mockito-junit-jupiter:5.21.0"
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
	exclude '.cache'
}

processResources {
	def ver = project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand([
			'file': [
				'jarVersion': ver
			]
		])
	}
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "VoidFog",
                "Specification-Vendor"    : "Tamaized",
                "Specification-Version"   : "${version}",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Tamaized",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def mavenUser = hasProperty("CIMUser") ? CIMUser : secrets.getProperty("maven_username")
def mavenToken = hasProperty("CIMToken") ? CIMToken : secrets.getProperty("maven_password")

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            afterEvaluate {
                artifact this.project.shadowJar
                artifact this.project.sourceJar
            }
            groupId 'tamaized'
            artifactId this.project.mod_id
        }
    }
    repositories {
        maven {
            url "https://maven.tamaized.com/releases"
            credentials {
                username mavenUser
                password mavenToken
            }
        }
    }
}

tasks.register('sourceJar', Jar) {
	dependsOn 'classes'
	from sourceSets.main.allSource
	archiveClassifier = 'sources'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

build.dependsOn shadowJar